[versions]
junit = "6.1.3"
# The real Fabric Loader, taken from the Fabric maven (Fabric Loader is not published to Maven
# Central). This is the mod loader the whole workspace launches the game through.
fabric-loader = "0.19.5"
# Mixin, as shipped with that loader (see fabric-loader-0.19.5.json, "libraries").
sponge-mixin = "0.17.4+mixin.0.8.7"
# ASM, as shipped with that loader. 9.10.x is required because the port's classes are Java 25
# (class file major version 69) and older ASM releases cannot read them.
asm = "9.10.1"
# The one logging stack of the workspace: the SLF4J API (what the loader, Mixin and every mod log
# through) over the Log4j backend (the implementation and the configuration both of them end up in,
# see build.gradle.kts and PvzGameProvider).
slf4j = "2.0.20"
log4j = "2.26.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "sponge-mixin" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
